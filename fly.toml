# One always-on machine with one volume: the single token owner.
# Do not scale above one machine; two would each refresh the single-use Tesla token.
app = "tesla-fleet-mcp-toneeraj"
primary_region = "iad"

[build]

[env]
  PUBLIC_BASE_URL = "https://tesla-fleet-mcp-toneeraj.fly.dev"
  ALLOWED_GITHUB_LOGINS = "toneeraj"

[[mounts]]
  source = "tesla_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
