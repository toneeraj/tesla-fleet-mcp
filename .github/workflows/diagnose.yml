# Read-only diagnostics for the hosted server: Actions -> Diagnose -> Run workflow.
# Changes nothing. Reports registered OAuth clients, how far each sign-in got,
# a sanitized audit-log summary, and sanitized server log lines for the sign-in routes.
# This repository is public, so everything printed is stripped of IPs, codes,
# tokens and query strings first.
name: Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APP: tesla-fleet-mcp-toneeraj
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Load Fly token from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://tesla-fleet/fly-api-token/password

      - name: Sign-in state and audit summary
        run: |
          set -euo pipefail
          code=$(base64 -w0 tesla_fleet/diagnose.py)
          flyctl ssh console -a "$APP" -q -C "python -c \"import base64,asyncio;g={'__name__':'diag'};exec(base64.b64decode('$code'),g);asyncio.run(g['main']())\"" > report.json 2> ssh.err || { tail -5 ssh.err; exit 1; }
          python3 - <<'PY'
          import json, re
          text = open("report.json").read()
          start = text.find("{")
          report = json.loads(text[start:])
          compact = json.dumps(report, separators=(",", ":"))
          compact = re.sub(r"\b\d{1,3}(\.\d{1,3}){3}\b", "<ip>", compact)
          compact = re.sub(r"\b[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{0,4}){2,7}\b", "<ip>", compact)
          for i in range(0, len(compact), 2500):
              print(f"::notice title=diagnose {i // 2500 + 1}::{compact[i:i + 2500]}")
          PY

      - name: Sign-in lines from server logs
        run: |
          set -uo pipefail
          flyctl logs -a "$APP" --no-tail > logs.txt 2>/dev/null || true
          grep -E '/register|/authorize|/consent|/auth/callback|/token|invalid_|redirect_uri|code_verifier|ERROR|Traceback' logs.txt \
            | sed -E 's/\x1b\[[0-9;]*m//g; s/\?[^ "]*/?<q>/g; s/\b[0-9]{1,3}(\.[0-9]{1,3}){3}(:[0-9]+)?\b/<ip>/g; s/\b[0-9a-fA-F]{1,4}(:[0-9a-fA-F]{0,4}){2,7}\b/<ip>/g; s/[A-Za-z0-9_\-]{24,}/<redacted>/g' \
            | tail -40 > signin.txt
          echo "lines: $(wc -l < signin.txt)"
          python3 - <<'PY'
          lines = open("signin.txt").read()
          if not lines.strip():
              print("::notice title=logs::no sign-in lines in Fly's recent log buffer")
          for i in range(0, len(lines), 2500):
              print(f"::notice title=logs {i // 2500 + 1}::" + lines[i:i + 2500].replace("\n", " %0A "))
          PY
