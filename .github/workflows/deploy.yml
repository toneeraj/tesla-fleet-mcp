# Deploy the hosted server to Fly from the browser: Actions -> Deploy -> Run workflow.
# Secrets live in 1Password, vault "tesla-fleet". GitHub holds exactly one secret:
# OP_SERVICE_ACCOUNT_TOKEN, a service account with read-only access to that vault.
# Values go 1Password -> this run -> Fly; they are masked in logs and never in the repo.
#
# Vault "tesla-fleet", one Password item per value (the value in the password field):
#   fly-api-token             Fly access token
#   github-oauth-client-id    GitHub OAuth app client ID
#   github-oauth-client-secret
#   tesla-client-id           Tesla developer app client ID
#   tesla-tokens-seed         one-time: contents of tokens.json; delete after first deploy
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      APP: tesla-fleet-mcp-toneeraj
      REGION: iad
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://tesla-fleet/fly-api-token/password
          OAUTH_CLIENT_ID: op://tesla-fleet/github-oauth-client-id/password
          OAUTH_CLIENT_SECRET: op://tesla-fleet/github-oauth-client-secret/password
          TESLA_CLIENT_ID: op://tesla-fleet/tesla-client-id/password

      - name: Load the one-time Tesla token seed, if present
        uses: 1password/load-secrets-action@v5
        continue-on-error: true
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TESLA_TOKENS_JSON: op://tesla-fleet/tesla-tokens-seed/password

      - name: Create app and volume if missing
        run: |
          set -euo pipefail
          # Works with an app-scoped deploy token: only this app is ever queried.
          # Creating the app on a first deploy needs an organisation token.
          if flyctl volumes list -a "$APP" --json > volumes.json 2>/dev/null; then
            echo "App $APP exists."
          else
            flyctl apps create "$APP"
            echo '[]' > volumes.json
          fi
          if ! jq -e 'length > 0' volumes.json > /dev/null; then
            flyctl volumes create tesla_data -a "$APP" --region "$REGION" --size 1 --yes
          fi

      - name: Stage secrets
        id: secrets
        run: |
          set -euo pipefail
          args=(GITHUB_CLIENT_ID="$OAUTH_CLIENT_ID" GITHUB_CLIENT_SECRET="$OAUTH_CLIENT_SECRET" TESLA_CLIENT_ID="$TESLA_CLIENT_ID")
          # The signing key is generated once on Fly and never leaves it.
          if ! flyctl secrets list -a "$APP" --json | jq -e '.[] | select((.Name // .name) == "JWT_SIGNING_KEY")' > /dev/null; then
            args+=(JWT_SIGNING_KEY="$(openssl rand -base64 48)")
          fi
          # One-time seed of the Tesla login. The server ignores it if it already holds tokens.
          seeded=false
          if [ -n "${TESLA_TOKENS_JSON:-}" ]; then
            args+=(TESLA_BOOTSTRAP_TOKENS="$TESLA_TOKENS_JSON")
            seeded=true
          fi
          flyctl secrets set -a "$APP" --stage "${args[@]}" > /dev/null
          echo "seeded=$seeded" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: flyctl deploy -a "$APP" --remote-only --ha=false

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP.fly.dev/healthz"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::Health check failed"; exit 1

      - name: Remove the one-time token seed from Fly
        if: steps.secrets.outputs.seeded == 'true'
        run: flyctl secrets unset -a "$APP" TESLA_BOOTSTRAP_TOKENS > /dev/null
