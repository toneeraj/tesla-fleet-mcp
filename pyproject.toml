[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-fleet-mcp"
version = "0.1.0"
description = "Read-only MCP server over Tesla's official Fleet API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Neeraj Singh" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastmcp>=4.1", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tesla-fleet-mcp = "tesla_fleet.server:main"

[tool.setuptools]
packages = ["tesla_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
